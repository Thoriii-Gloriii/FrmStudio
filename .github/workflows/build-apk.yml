name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  issues: write

env:
  APP_NAME: "S'ovo-Chat:v1.5"
  APK_FILE: S-ovo-Chat-v1.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    - run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --parallel --build-cache

    - name: Rename APK
      run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"

    - uses: actions/upload-artifact@v4
      with:
        name: S-ovo-Chat-v1.5
        path: ${{ env.APK_FILE }}

    - name: Update "latest" release with APK
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --cleanup-tag --yes || true
        gh release create latest "$APK_FILE" \
          --target "$GITHUB_SHA" \
          --prerelease \
          --title "$APP_NAME" \
          --notes "Built from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')"

    - name: Create issue with download link
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        APK_URL="https://github.com/${{ github.repository }}/releases/download/latest/${APK_FILE}"
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        gh issue create \
          --title "$APP_NAME (build #${{ github.run_number }})" \
          --body "**Direct download:** [$APK_FILE]($APK_URL)

        Commit: \`${GITHUB_SHA::7}\`
        Workflow run: $RUN_URL"